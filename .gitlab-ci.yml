stages:
  - setup
  - test

default:
  image: ubuntu:latest

setup:
  stage: setup

  cache:
    key:
      files:
        - script/library.pl
      prefix: libs-x86_64-linux
    paths:
      - external-x86_64-linux

  before_script:
    - apt update && apt install curl make unzip xz-utils -y

  script:
    - make external-x86_64-linux

test:
  stage: test

  needs:
    - setup

  cache:
    key:
      files:
        - script/library.pl
      prefix: libs-x86_64-linux
    paths:
      - external-x86_64-linux
    policy: pull

  script:
    - zig build --release=fast test
