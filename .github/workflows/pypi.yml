name: Pypi

on:
  push:
    tags:
      - 'v**'

jobs:
  pypi:
    name: ${{matrix.target}}-${{matrix.abi}}
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            abi: musl
            plat_name: manylinux_2_17_x86_64
            cpu: x86_64_v3
          - target: aarch64-linux
            abi: musl
            plat_name: manylinux_2_17_aarch64
            cpu: baseline
          - target: x86_64-macos
            abi: none
            plat_name: macosx_11_0_x86_64
            cpu: x86_64_v3
          - target: aarch64-macos
            abi: none
            plat_name: macosx_11_0_arm64
            cpu: baseline
          - target: x86_64-windows
            abi: gnu
            plat_name: win_amd64
            cpu: x86_64_v3
          - target: aarch64-windows
            abi: gnu
            plat_name: win_arm64
            cpu: baseline

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Install Build Tools
        run: pip install build

      - name: Cache Compiled Libraries
        id: cache-libs
        uses: actions/cache@v5
        with:
          path: external-${{matrix.target}}
          key: libs-${{matrix.target}}-${{hashFiles('script/library.pl')}}

      - name: Install Dependencies
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: sudo apt update && sudo apt-get install xorg-dev

      - name: Install Boost
        id: install-boost
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: MarkusJx/install-boost@v2
        with:
          boost_version: 1.83.0
          platform_version: 22.04

      - name: Compile Libraries
        if: steps.cache-libs.outputs.cache-hit != 'true'
        env:
          BOOST_ROOT: ${{steps.install-boost.outputs.BOOST_ROOT}}
        run: ./script/library.pl --target ${{matrix.target}} -j 1

      - name: Compile Zinq
        run: zig build --release=fast -Dtarget=${{matrix.target}}-${{matrix.abi}} -Dcpu=${{matrix.cpu}}

      - name: Copy Binary
        run: |
          shopt -s nullglob && mkdir -p zinq/bin && cd zig-out && for FOLDER in *64*linux*;   do cp $FOLDER/zinq     ../zinq/bin/zinq;     done && cd -
          shopt -s nullglob && mkdir -p zinq/bin && cd zig-out && for FOLDER in *64*macos*;   do cp $FOLDER/zinq     ../zinq/bin/zinq;     done && cd -
          shopt -s nullglob && mkdir -p zinq/bin && cd zig-out && for FOLDER in *64*windows*; do cp $FOLDER/zinq.exe ../zinq/bin/zinq.exe; done && cd -

      - name: Build Wheel
        run: python -m build --wheel -C--build-option=--plat-name=${{matrix.plat_name}}

      - name: Publish Package Distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
