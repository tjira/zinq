name: Build

on:
  push:
    branches:
      - '*'

permissions:
  contents: read

jobs:
  build:
    name: ${{matrix.os}} / Build
    runs-on: ${{matrix.os}}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build the Project in Debug Mode
        run: make DEBUG=1
