name: Library

on:
  push:
    branches:
      - '*'

permissions:
  contents: read

jobs:
  compile:
    name: ${{matrix.os}} / ${{matrix.target}}${{matrix.generic && ' / generic' || ''}}
    runs-on: ${{matrix.os}}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            generic: false
          - os: ubuntu-latest
            target: x86_64-linux
            generic: true
          - os: ubuntu-latest
            target: aarch64-linux
            generic: false
          - os: ubuntu-latest
            target: aarch64-linux
            generic: true
          - os: ubuntu-latest
            target: x86_64-macos
            generic: false
          - os: ubuntu-latest
            target: x86_64-macos
            generic: true
          - os: ubuntu-latest
            target: aarch64-macos
            generic: false
          - os: ubuntu-latest
            target: aarch64-macos
            generic: true
          - os: ubuntu-latest
            target: x86_64-windows
            generic: false
          - os: ubuntu-latest
            target: x86_64-windows
            generic: true
          - os: ubuntu-latest
            target: aarch64-windows
            generic: false
          - os: ubuntu-latest
            target: aarch64-windows
            generic: true

    steps:
      - uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Cache Compiled Libraries
        id: cache-libs
        uses: actions/cache@v5
        with:
          path: external-${{matrix.target}}
          key: libs-${{matrix.target}}-${{matrix.generic && 'generic' || 'dynamic'}}-${{hashFiles('script/library.pl')}}

      - name: Install Dependencies
        run: sudo apt update && sudo apt-get install llvm xorg-dev

      - name: Install Boost
        id: install-boost
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: MarkusJx/install-boost@v2
        with:
          boost_version: 1.83.0
          platform_version: 22.04

      - name: Compile Libraries
        if: steps.cache-libs.outputs.cache-hit != 'true'
        env:
          BOOST_ROOT: ${{steps.install-boost.outputs.BOOST_ROOT}}
        run: ./script/library.pl --target ${{matrix.target}} ${{matrix.generic && '--generic' || ''}} -j 1

      - name: Remove Unnecessary Files
        working-directory: external-${{matrix.target}}
        run: rm -rf bin share lib/cmake lib/pkgconfig include/*.bib include/*.f03 lib/*.la

      - name: Remove Eigen Signature File
        working-directory: external-${{matrix.target}}
        run: rm -f include/eigen3/signature_of_eigen3_matrix_library

      - name: Strip Debug Symbols
        working-directory: external-${{matrix.target}}
        run: llvm-strip --strip-debug --remove-section=.llvm_addrsig lib/*.a

      - name: Prepare Artifact Directory
        run: mkdir -p staging && cp -r external-${{matrix.target}} staging
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: external-${{matrix.target}}${{matrix.generic && '-generic' || ''}}
          path: staging
